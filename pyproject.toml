[build-system]
requires = ["setuptools >= 64.0"]
build-backend = "setuptools.build_meta"

[project]
dynamic = ["version"]

name = "mtp"
dependencies = [
  # Pin hydrax to the commit that includes the merged MTP controller
  # (PR #75), BugTrap navigation task (PR #76), Akima/B-spline spline
  # primitives (PR #74), the spline extrapolation bugfix (PR #70),
  # MPPI-CMA (PR #71), and MjWarp support (PR #72).
  "hydrax @ git+https://github.com/vincekurtz/hydrax.git@33ec819479c25d623a4ad490574c00e624848d2c",
  "jax>=0.8.0",
  "mujoco>=3.8.0",
  "mujoco-mjx>=3.8.0",
  "flax>=0.12.0",
  "interpax>=0.3.12",
  "matplotlib",
  "tqdm",
]
requires-python = ">= 3.12"

authors = [
  {name = "An T. Le", email = "an.thai.le97@gmail.com"},
]
description = "Model Tensor Planning: High-entropy sampling-based MPC via structured tensor sampling and spline interpolation."
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["MPC", "Tensor", "MuJoCo", "JAX", "Motion Planning", "Sampling", "Spline"]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://sites.google.com/view/tensor-sampling/"
Repository = "https://github.com/anindex/mtp"
Paper = "https://arxiv.org/abs/2505.01059"

[tool.setuptools.packages.find]
include = ["mtp", "mtp.*"]
exclude = []
